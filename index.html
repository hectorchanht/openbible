<style>
:root{--bg:#0a0a0b;--panel:#131315;--panel2:#17171a;--line:#26262b;--text:#f5f2ee;--muted:#a8a29b;--accent:#8b7ad8;--accent-soft:#b3a6ec;--radius:16px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans CJK TC",sans-serif;--serif:Georgia,"Times New Roman","Noto Serif TC","Noto Serif CJK TC",serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 20px;min-width:0}
a{color:var(--accent-soft)}
header.utility{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:700;letter-spacing:.02em;min-width:0}
.brand img{width:40px;height:40px;flex:0 0 auto}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .hall{color:var(--muted);font-weight:500;font-size:.85rem}
.lang-switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel);flex:0 0 auto}
.lang-switch button{min-width:44px;min-height:34px;padding:5px 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font:600 .88rem var(--sans)}
.lang-switch button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.hero{padding:38px 0 8px}
.hero .mark{width:84px;height:84px}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.05;margin:.35em 0 .25em;font-weight:800;letter-spacing:-.01em;overflow-wrap:break-word}
.hero .promise{font-family:var(--serif);font-size:clamp(1.12rem,4.6vw,1.45rem);line-height:1.5;color:#e8e2d9;max-width:34em}
.status{display:inline-flex;max-width:100%;margin-top:16px;padding:7px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent-soft);font-size:.9rem;font-weight:600}
.status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
section.block{padding:22px 0 4px}
section.block>h2{font-size:clamp(1.4rem,6vw,1.9rem);margin:10px 0 10px}
section.block>p{color:#e8e2d9;max-width:36em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0 0 14px;min-width:0}
.card h3{font-size:1.12rem;margin:0 0 .4em;line-height:1.3;overflow-wrap:break-word}
.card p{margin:0;color:var(--muted)}
ol.road{margin:0;padding-left:1.3em;color:#e8e2d9}
ol.road li{margin:0 0 10px}
.kicker{color:var(--accent-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:26px 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem;margin-top:26px}
footer p{margin:0}footer .links{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.footer-legal{color:var(--muted);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
@media (max-width:520px){header.utility{min-height:56px}footer{align-items:flex-start;flex-direction:column}}

<script>
const I={"en": {"promise": "Opening and dissecting the most influential book in human history.", "desc": "OpenBible opens the Bible and takes it apart — how it was written, by whom, and what scholarship can and cannot support — with truth labels on every card. Dissection, not preaching, not mockery. 繁中 first.", "whatH": "What it is", "goalH": "END GOAL", "goal": "Open the biggest book of the taboo / esoteric / mysterious shelf: the most influential book in human history, surrounded by questions most people have heard whispered but never seen answered plainly — open it, and take it apart, 拆解聖經.", "roadH": "ROADMAP", "statusH": "STATUS", "status": "Founding — direction set, grilling not yet done. No content cards are published yet; the seed content pack （拆解十問） is the next step.", "statusBody": "This page is the live initialization of OpenBible. The founding direction is on record (brief filed 2026-11-21); grilling is not yet done and no content cards are published yet — the seed content pack （拆解十問） is the next step. Nothing here is presented as finished.", "guardH": "Guardrails", "guard": "A neutral scholarly stance is a failing-if-broken property: no card may preach, debunk-for-sport, or present a faith claim as verified fact (or a scholarly consensus as faith). Quotations come from public-domain / standard translations — summarise and link, never republish wholesale.", "foot": "Dawn Studio · Independent software.", "hall": "OpenSchool family", "what": [["Dissection, not preaching, not mockery", "How this book was written, by whom, over how long, how the canon was chosen, what the texts claim, and what history, archaeology and textual scholarship can and cannot support. Believers and sceptics both get honesty."], ["Truth labels, Bible edition", "Every card carries one of: mainstream scholarly consensus / scholars genuinely split / what the tradition believes — reported as belief, not verified fact / what the text literally says, quoted."], ["The famous questions, plainly", "How the canon was chosen, whether Moses really wrote it, whether Exodus has archaeological evidence, what the Dead Sea Scrolls changed, why the apocrypha stayed out, why the four Gospels differ, who Revelation is about, how translation drifts. Discovery-first by question, not by book order."], ["Always linked", "Bible ↔ OpenEarth (the real geography of the texts, on the map) ↔ history ↔ the Dawn Buddha / esoterica shelf — religions and esoterica set side by side, so the whole picture shows."]], "road": ["Seed content pack — 拆解十問， the ten dissection questions", "Space — the founding home for the work", "Grilling — depth, the scope of cross-religion comparison, and the tone line"]}, "zh": {"promise": "拆解人類最有影響力嗰本書。", "desc": "OpenBible 打開聖經，拆解佢 — 點寫成、邊個寫、學術研究支持到啲咩、支持唔到啲咩 — 每張卡都有真理標籤。係拆解，唔係佈道，唔係嘲笑。繁中先行。", "whatH": "呢個係咩", "goalH": "終極目標 · END GOAL", "goal": "打開「禁忌・神秘學」書架上面最大嗰本書：人類歷史上最有影響力嘅書，身邊圍住好多人細細聲問過、但從未見過直白答案嘅問題 — 打開佢，拆解佢。", "roadH": "路線圖 · ROADMAP", "statusH": "現況 · STATUS", "status": "創建中 — 方向已定，grilling 未完成。暫時未有內容卡出版；下一步係種子內容包（拆解十問）。", "statusBody": "呢一頁係 OpenBible 嘅 live 初始化。立派方向已存檔（文件於 2026-11-21 存檔）；grilling 未完成，暫時未有內容卡出版 —— 下一步係種子內容包（拆解十問）。呢度冇任何嘢扮成已完成。", "guardH": "守則", "guard": "中立學術立場係「壞咗即係缺陷」嘅屬性：冇卡可以佈道、為嘲笑而拆穿、將信仰講法當已核實事實（或者將學界共識當信仰）。引文來自公有領域／標準譯本 — 撮要同連結，唔會成段轉載。", "foot": "Dawn Studio · 獨立軟件。", "hall": "OpenSchool 家族", "what": [["拆解，唔係佈道，唔係嘲笑", "呢本書點寫成、邊個寫、寫咗幾耐、正典點揀出嚟、經文講咩，同埋歷史、考古、文本學術支持到啲咩、支持唔到啲咩。信徒同懷疑者，都得到誠實。"], ["真理標籤 — 聖經版", "每張卡都帶住其中一個標籤：學界主流共識／學者真係有分歧／傳統所相信嘅 — 作為信仰咁報告，唔係已核實事實／經文字面所講嘅，原文引述。"], ["出名嗰啲問題，直白咁答", "正典點揀出嚟、摩西係咪真作者、出埃及記有冇考古證據、死海古卷改咗啲咩、偽經點解唔入正典、四福音點解有出入、啟示錄講緊邊個、翻譯點樣走樣（和合本係點嚟）。按問題去搵，唔係按書卷次序。"], ["永遠互連", "聖經 ↔ OpenEarth（經文嘅真實地理，喺地圖上面）↔ 歷史 ↔ Dawn Buddha／神秘學書架 — 宗教與神秘學互相對照，先至見到全圖。"]], "road": ["種子內容包 — 拆解十問", "Space — 呢個項目嘅立派基地", "Grilling — 深度、對照宗教嘅範圍、語氣尺度"]}};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function setLang(l){
  document.documentElement.lang = l==="zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(typeof I[l][k]==="string") el.textContent=I[l][k]; });
  document.getElementById("what").innerHTML = I[l].what.map(x=>'<div class="card"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join("");
  document.getElementById("road").innerHTML = I[l].road.map(x=>'<li>'+esc(x)+'</li>').join("");
  document.getElementById("btn-en").setAttribute("aria-pressed", l==="en");
  document.getElementById("btn-zh").setAttribute("aria-pressed", l==="zh");
  try{localStorage.setItem("openbible-lang", l)}catch(e){}
}
document.getElementById("btn-en").addEventListener("click",()=>setLang("en"));
document.getElementById("btn-zh").addEventListener("click",()=>setLang("zh"));
let init="en"; try{ init = localStorage.getItem("openbible-lang")||"en" }catch(e){}
setLang(init==="zh"?"zh":"en");
</script>
